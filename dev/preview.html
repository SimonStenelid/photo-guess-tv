<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Guess TV · Local Preview</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .preview { max-width: 100rem; margin: auto; padding: 1.7rem 2.5vw; }
    .preview-header, .preview-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; }
    .preview-header { justify-content: space-between; margin-bottom: 1.2rem; }
    .preview-header h1 { font-size: 1.65rem; }
    .preview-grid { display: grid; grid-template-columns: minmax(0, 2.65fr) minmax(18rem, 1fr); gap: 1.1rem; }
    .preview-device { min-width: 0; }
    .preview-device h2 { font-size: 1rem; margin: 0 0 .55rem; }
    .preview-tabs { margin-bottom: .55rem; }
    .preview-tabs button { padding: .3rem .55rem; box-shadow: none; }
    .preview-tabs button[aria-pressed="true"] { background: var(--lime); }
    .preview iframe { width: 100%; height: 70vh; min-height: 460px; border: 2px solid var(--ink); border-radius: 1rem; background: var(--lavender); }
    .preview-note { margin-top: .8rem; font-size: .9rem; line-height: 1.4; }
    @media (max-width: 820px) { .preview-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="preview">
    <header class="preview-header">
      <h1>Sticker Party preview</h1>
      <a href="/preview/audio">Sound check</a>
      <button type="button" id="reset" class="primary">Reset demo</button>
    </header>
    <div class="preview-grid">
      <section class="preview-device">
        <h2><a href="/tv" target="_blank" rel="noopener">TV screen</a></h2>
        <iframe title="TV screen" id="tv" src="/tv"></iframe>
      </section>
      <section class="preview-device">
        <nav class="preview-tabs" aria-label="Preview a player's phone">
          <button type="button" data-player="alex" aria-pressed="true">Alex</button>
          <button type="button" data-player="jamie" aria-pressed="false">Jamie</button>
          <button type="button" data-player="sam" aria-pressed="false">Sam</button>
        </nav>
        <iframe title="Alex’s phone" id="phone" src="/join?demo=alex"></iframe>
      </section>
    </div>
    <p class="preview-note" id="note" role="status">Start a game on the TV. Switch between the sample phones to vote, then reveal the answer.</p>
  </main>
  <script>
    const phone = document.getElementById('phone');
    const tv = document.getElementById('tv');
    const note = document.getElementById('note');
    const tabs = Array.from(document.querySelectorAll('[data-player]'));
    let active = tabs[0];
    function openPhone() {
      phone.title = active.textContent + '’s phone';
      phone.src = '/join?demo=' + active.dataset.player;
    }
    for (const tab of tabs) {
      tab.onclick = () => {
        if (active === tab) return;
        active.setAttribute('aria-pressed', 'false');
        active = tab;
        active.setAttribute('aria-pressed', 'true');
        openPhone();
      };
    }
    document.getElementById('reset').onclick = async (event) => {
      event.target.disabled = true;
      try {
        const response = await fetch('/api/dev/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        if (!response.ok) throw new Error('Reset failed');
        tv.src = '/tv';
        openPhone();
        note.textContent = 'Demo reset. Start a game on the TV and vote from the sample phones.';
      } catch {
        note.textContent = 'Could not reset. Check that the preview server is running.';
      } finally {
        event.target.disabled = false;
      }
    };
  </script>
</body>
</html>
